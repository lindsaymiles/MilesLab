project:
  type: website
  output-dir: _site

website:
  title: "Miles Lab"
  description: "Urban evolution and population genomics at Purdue University"
  site-url: "https://lindsaymiles.github.io/MilesLab/"   
  repo-url: "https://github.com/lindsaymiles/MilesLab"   
  favicon: images/favicon.svg
  page-navigation: false
  navbar:
    logo: images/logo.svg
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: people.qmd
        text: People
      - href: publications.qmd
        text: Publications
      - href: join.qmd
        text: Join the Lab
      - href: news.qmd
        text: News
      - href: resources.qmd
        text: Resources
      - href: contact.qmd
        text: Contact
    right:
      - icon: github
        href: "https://github.com/lindsaymiles"   # TODO
        aria-label: GitHub
